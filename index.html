<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>daily data.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Daily Data home">daily data<span>.</span></a>
      <div class="topbar-right">
        <span class="save-indicator" id="save-indicator"><i></i> Saved</span>
        <button class="icon-button" id="settings-button" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </header>

    <main id="app-main">
      <section class="view active" id="home-view"></section>
      <section class="view" id="stats-view"></section>
      <section class="view" id="new-view"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-tab="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-item" data-tab="stats"><span class="nav-icon">▥</span><span>Stats</span></button>
      <button class="nav-item" data-tab="new"><span class="nav-icon plus-icon">＋</span><span>New</span></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
